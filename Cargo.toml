[package]
name = "fullscreen-ws"
version = "0.1.0"
description = "Move fullscreen and maximized windows to their own COSMIC workspace"
license = "MIT"
readme = "README.md"
edition = "2024"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols", rev = "c0cff4d", default-features = false, features = ["client"] }

[profile.release]
strip = true
lto = true
